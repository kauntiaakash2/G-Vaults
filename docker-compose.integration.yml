services:
  postgres-integration:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sih_integration
      POSTGRES_USER: sih_test
      POSTGRES_PASSWORD: sih_test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_test -d sih_integration"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-integration:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sih_test_minio
      MINIO_ROOT_PASSWORD: sih_test_minio_password
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20
