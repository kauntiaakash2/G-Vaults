services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih}
      POSTGRES_USER: ${POSTGRES_USER:-sih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_local_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sih_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sih_minio_local_password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set none local/$${MINIO_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sih_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sih_minio_local_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-sih-documents}

  ocr:
    profiles: ["ocr"]
    build: ./services/ocr
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OCR_INTERNAL_TOKEN: ${OCR_INTERNAL_TOKEN:-local-only-ocr-token-change-me-26190}

volumes:
  postgres_data:
  minio_data:
